{{define "content"}}
<div class="head"><h1>Log in</h1></div>
<p id="login-status" class="muted">Checking your latere login…</p>
<p><button id="login" hidden>Log in with latere</button></p>
<script src="/login-sdk.js"></script>
<script>
(function () {
  var next = {{.Data}};
  var status = document.getElementById('login-status');
  var button = document.getElementById('login');
  function offer(msg) {
    status.textContent = msg;
    button.hidden = false;
  }
  button.onclick = function () { latereAuth.login(location.origin + location.pathname); };
  if (!window.latereAuth) { offer('The login script did not load.'); return; }
  latereAuth.handleCallback().then(function () {
    return latereAuth.getToken();
  }).then(function (tok) {
    if (!tok) { offer('Log in with the latere account that owns this library.'); return; }
    return fetch('/library/login', { method: 'POST', headers: { Authorization: 'Bearer ' + tok } }).then(function (r) {
      if (r.ok) { location.replace(next); return; }
      offer(r.status === 403 ? 'This latere account is not the owner of this library.' : 'Login failed (' + r.status + ').');
    });
  }).catch(function (e) { offer('Login failed: ' + e.message); });
})();
</script>
{{end}}
