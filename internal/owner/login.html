<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <meta name="robots" content="noindex">
        <title>Log in · Changkun Ou</title>
        <link rel="icon" href="/logo.png">
        <script>
            // Before the styles, so a dark page never paints light first.
            // The key is the home page's, the blog's, and the research
            // page's: 'light' or 'dark' when chosen.
            (function() {
                var t = null;
                try { t = localStorage.getItem('theme'); } catch (e) {}
                if (t !== 'light' && t !== 'dark') {
                    t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            /* The home page's look, inline, as the 401 and 404 pages have it. */
            :root {
                --bg: #ffffff;
                --bg-raised: #f4f4f4;
                --text: #0d0d0d;
                --text-secondary: #525252;
                --text-muted: #666666;
                --navy: #38538f;
                --border-strong: rgba(0, 0, 0, 0.14);
                --photo-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 20px rgba(0, 0, 0, 0.10);
                --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            }

            [data-theme="dark"] {
                --bg: #161616;
                --bg-raised: #262626;
                --text: #ececec;
                --text-secondary: #b4b4b4;
                --text-muted: #9a9a9a;
                --navy: #9bb0e4;
                --border-strong: rgba(255, 255, 255, 0.14);
                --photo-shadow: 0 1px 2px rgba(0, 0, 0, 0.40), 0 6px 20px rgba(0, 0, 0, 0.45);
                color-scheme: dark;
            }

            * { box-sizing: border-box; }

            ::selection { background: #555; color: #fff; }

            html { height: 100%; }

            body {
                margin: 0;
                min-height: 100%;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                color: var(--text);
                font: 16px/1.6 var(--sans);
                -webkit-font-smoothing: antialiased;
                transition: background 0.3s, color 0.3s;
            }

            a { text-decoration: none; }

            a:focus-visible,
            button:focus-visible {
                outline: 2px solid var(--text);
                outline-offset: 2px;
                border-radius: 4px;
            }

            .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

            /* Where the home page has it. */
            .theme-toggle {
                position: fixed;
                top: 16px;
                right: 16px;
                width: 36px;
                height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                border: 1px solid var(--border-strong);
                border-radius: 8px;
                background: none;
                color: var(--text-secondary);
                cursor: pointer;
                transition: color 0.2s, background-color 0.2s;
            }

            .theme-toggle:hover { color: var(--text); background: var(--bg-raised); }

            .theme-toggle svg { width: 18px; height: 18px; }

            [data-theme="light"] .icon-sun,
            [data-theme="dark"] .icon-moon { display: none; }

            main {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 72px 24px;
            }

            .hero {
                display: flex;
                flex-wrap: wrap;
                gap: 32px;
                align-items: flex-start;
                width: 100%;
                max-width: 760px;
            }

            .portrait {
                flex: none;
                width: 130px;
                height: 130px;
                margin-top: 7px;
                border-radius: 12px;
                box-shadow: var(--photo-shadow);
                object-fit: cover;
            }

            .text { flex: 1; min-width: 280px; }

            h1 {
                margin: 0;
                font-weight: 600;
                font-size: clamp(30px, 5vw, 38px);
                line-height: 1.15;
                letter-spacing: -0.02em;
            }

            .status { color: var(--navy); font-weight: 400; }

            p {
                margin: 12px 0 0;
                line-height: 1.65;
                color: var(--text-secondary);
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                gap: 10px 24px;
                margin-top: 24px;
                font-size: 14px;
                font-weight: 500;
            }

            /* As the home page's links: the ink at rest, the navy under
             * the pointer, icon and all. */
            nav a {
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--text);
                transition: color 0.2s;
            }

            nav svg {
                width: 16px;
                height: 16px;
                color: var(--text-secondary);
                transition: color 0.2s;
            }

            nav button {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0;
                border: 0;
                background: none;
                font: inherit;
                color: var(--text);
                cursor: pointer;
                transition: color 0.2s;
            }

            nav button[hidden] { display: none; }

            nav a:hover,
            nav a:hover svg,
            nav button:hover,
            nav button:hover svg { color: var(--navy); }

            footer {
                padding: 28px 24px 32px;
                text-align: center;
                font-size: 13px;
                color: var(--text-muted);
            }

            footer a { color: var(--text-muted); transition: color 0.2s; }

            footer a:hover { color: var(--text-secondary); }

            @media (max-width: 600px) {
                main { padding: 64px 16px; align-items: flex-start; }
                .hero { gap: 24px; }
                .portrait { width: 72px; height: 72px; margin-top: 0; }
            }
        </style>
    </head>
    <body>
        <svg class="sprite" aria-hidden="true" focusable="false">
            <symbol id="i-moon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
            <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></g></symbol>
            <symbol id="i-login" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></g></symbol>
            <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g></symbol>
        </svg>

        <button class="theme-toggle" type="button" aria-label="Toggle theme">
            <svg class="icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
            <svg class="icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>

        <main>
            <div class="hero">
                <img class="portrait" src="/logo.png" alt="Changkun Ou" width="130" height="130">
                <div class="text">
                    <h1>Log in</h1>
                    <p id="login-status">Checking your latere login…</p>
                    <nav aria-label="Pages">
                        <button id="login" type="button" hidden><svg aria-hidden="true"><use href="#i-login"/></svg>Log in with latere</button>
                        <a href="/"><svg aria-hidden="true"><use href="#i-home"/></svg>Home</a>
                    </nav>
                </div>
            </div>
        </main>

        <footer>
            Copyright &copy; 2016&ndash;<script>document.write(new Date().getFullYear())</script> <a href="/">Changkun Ou</a>. All rights reserved.
        </footer>

        <script>
            (function() {
                var toggle = document.querySelector('.theme-toggle');
                toggle.addEventListener('click', function() {
                    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', t);
                    try { localStorage.setItem('theme', t); } catch (e) {}
                });
                matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                    var t = null;
                    try { t = localStorage.getItem('theme'); } catch (err) {}
                    if (t !== 'light' && t !== 'dark') document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                });
            })();
        </script>
        <script src="/login-sdk.js"></script>
        <script>
            // The page logs in by itself: with a latere token it asks the
            // server for the owner's cookie, and without one it goes to
            // latere. The button is only for when that did not work: latere
            // was cancelled or failed, the page went there a moment ago, or
            // the owner just logged out. So it never loops.
            (function() {
                var KEY = 'site.login';
                var params = new URLSearchParams(location.search);
                var status = document.getElementById('login-status');
                var button = document.getElementById('login');
                var saved = null;
                try { saved = JSON.parse(sessionStorage.getItem(KEY)); } catch (e) {}
                // latere returns to this page without ?next=, so the page to
                // go on to is kept across the round trip. The server checks
                // the same pattern.
                var next = {{.}};
                if (params.has('code') && saved && /^\/((library|blog)\/.*)?$/.test(saved.next)) next = saved.next;
                function offer(msg) {
                    status.textContent = msg;
                    button.hidden = false;
                }
                function start() {
                    try { sessionStorage.setItem(KEY, JSON.stringify({ next: next, at: Date.now() })); } catch (e) {}
                    status.textContent = 'Taking you to latere…';
                    latereAuth.login(location.origin + location.pathname);
                }
                button.onclick = start;
                if (!window.latereAuth) { offer('The login script did not load.'); return; }
                if (params.has('out')) {
                    // Logging out of the site logs out of every page that
                    // reads the latere token, such as urlstat's dashboard.
                    latereAuth.logout();
                    offer('You are logged out.');
                    return;
                }
                latereAuth.handleCallback().then(function() {
                    return latereAuth.getToken();
                }).then(function(tok) {
                    if (!tok) {
                        var recent = saved && Date.now() - saved.at < 60000;
                        if (params.has('error') || recent) { offer('Log in with the latere account that owns this site.'); return; }
                        start();
                        return;
                    }
                    return fetch('/login', { method: 'POST', headers: { Authorization: 'Bearer ' + tok } }).then(function(r) {
                        if (r.ok) {
                            try { sessionStorage.removeItem(KEY); } catch (e) {}
                            location.replace(next);
                            return;
                        }
                        offer(r.status === 403 ? 'This latere account does not own this site.' : 'Login failed (' + r.status + ').');
                    });
                }).catch(function(e) { offer('Login failed: ' + e.message); });
            })();
        </script>
    </body>
</html>
