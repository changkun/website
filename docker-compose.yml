name: website

services:
  website:
    container_name: website
    restart: always
    image: website:latest
    deploy:
      replicas: 1
    # .env is optional: without it the site serves and /ideas/ answers 503.
    env_file:
      - path: .env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
networks:
  traefik_proxy:
    external: true
