name: website

services:
  website:
    container_name: website
    restart: always
    image: website:latest
    deploy:
      replicas: 1
    # .env is optional: without it the site serves, and /ideas/ and /library/
    # answer 503.
    env_file:
      - path: .env
        required: false
    # The folders served at /<folder>/, such as the books and the blog.
    volumes:
      - /www/changkun.de:/www/changkun.de:ro
      # The library's cache.json and state/, written by the server.
      - ./data:/data
    environment:
      WWW_DIR: /www/changkun.de
      WWW_CORS: /demos/
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
networks:
  traefik_proxy:
    external: true
