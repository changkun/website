# Compose would otherwise name the stack after the clone's folder.
name: main

services:
  main:
    restart: always
    image: main:latest
    deploy:
      replicas: 1
    # .env is optional: without it the site serves and /ideas/ answers 503.
    env_file:
      - path: .env
        required: false
    environment:
      MAIN_ADDR: main:80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
networks:
  traefik_proxy:
    external: true
